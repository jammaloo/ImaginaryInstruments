<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Imaginary Instruments — play the air</title>
  <meta name="description" content="Play an invisible trombone and accordion with your webcam. Face and hand tracking, Web Audio synthesis — everything runs locally in your browser.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2316203a'/><path d='M30 22v56M50 22v56M70 22v56' stroke='%23c084fc' stroke-width='9' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>

    <header id="topbar" class="hidden">
      <div class="brand">Imaginary<span>Instruments</span></div>

      <nav class="switch" aria-label="Choose instrument">
        <button id="btnTrombone" class="switch-btn active" data-instrument="trombone">
          Trombone <kbd>1</kbd>
        </button>
        <button id="btnAccordion" class="switch-btn" data-instrument="accordion">
          Accordion <kbd>2</kbd>
        </button>
        <button id="btnMaracas" class="switch-btn" data-instrument="maracas">
          Maracas <kbd>3</kbd>
        </button>
        <button id="btnDrums" class="switch-btn" data-instrument="drums">
          Drums <kbd>4</kbd>
        </button>
        <button id="btnHarp" class="switch-btn" data-instrument="harp">
          Harp <kbd>5</kbd>
        </button>
        <button id="btnBass" class="switch-btn" data-instrument="bass">
          Bass <kbd>6</kbd>
        </button>
      </nav>

      <div class="top-right">
        <div id="status" class="pill">Starting…</div>
        <button id="muteBtn" class="icon-btn" title="Mute / unmute" aria-label="Mute or unmute">Mute</button>
      </div>
    </header>

    <div id="hint" class="hidden"></div>
    <div id="fps" class="hidden"></div>

    <section id="startPanel" class="panel">
      <h1>Play invisible instruments<br>with your own body</h1>

      <button id="startBtn" class="primary">Start camera &amp; play</button>
      <button id="mouseBtn" class="ghost">No camera? Try mouse mode</button>
      <p class="notice">Everything runs on your device – no video ever leaves it.</p>
      <p class="fineprint" id="modelStatus">Preloading tracking models (~15&nbsp;MB)…</p>
    </section>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
